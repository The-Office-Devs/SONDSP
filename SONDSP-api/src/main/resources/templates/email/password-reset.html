<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Recuperação de senha</title>
</head>
<body>
    <p>Olá, <span th:text="${userName}">usuário</span>.</p>
    <p>Recebemos uma solicitação para redefinir sua senha no SONDSP.</p>
    <p>
        <a th:href="${resetUrl}">Redefinir minha senha</a>
    </p>
    <p>Este link expira em <span th:text="${expirationMinutes}">15</span> minutos.</p>
    <p>Se você não solicitou esta alteração, ignore este e-mail.</p>
</body>
</html>
