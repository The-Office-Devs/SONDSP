spring:
  jpa:
    properties:
      hibernate:
        order_inserts: true
        order_updates: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 100
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        order_inserts: true
        order_updates: true
  servlet:
    multipart:
      max-file-size: 1024MB
      max-request-size: 1024MB
  main:
    allow-circular-references: true
  datasource:
    url: jdbc:postgresql://db.xhlevrhoytrxeglnvcjf.supabase.co:6543/postgres
    username: postgres
    password: "${DB_PASSWORD:postgres}"
    driver-class-name: org.postgresql.Driver
    hikari:
      maxLifeTime: 600000
      maximumPoolSize: 6
      idle-timeout: 20000
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: https://sso-test.int.kn/authorization/oauth2/jwks
  web:
    error:
      include-message: never
      include-stacktrace: never
      whitelabel:
        enabled: false
      include-exception: false
server:
  port: 8081
jwt:
  secret: "${JWT_SECRET:secret_caso_encontre}"